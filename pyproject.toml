[project]
name = "weather"
version = "0.1.0"
description = "Does the weather still move markets? A two-hemisphere, post-publication test (US + Australia)"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "arch>=7.0",
  "yfinance>=0.2.50",
  "requests>=2.31",
  "exchange_calendars>=4.5",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
